[project]
name = "dictado"
version = "0.1.0"
description = "Lightweight push-to-talk dictation for macOS: global hotkey, local ASR (Parakeet MLX or faster-whisper), pastes into the focused field."
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2,<2",
  "huggingface-hub>=0.23",
  "parakeet-mlx>=0.5,<0.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "pyobjc-framework-Cocoa>=11",
  "pyobjc-framework-Quartz>=11",
  "pyobjc-framework-AVFoundation>=11",
  "pyobjc-framework-ApplicationServices>=11",
]

license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Facundo Canale" }]

[project.scripts]
dictado = "dictado.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dictado"]

[tool.pytest.ini_options]
testpaths = ["tests"]
